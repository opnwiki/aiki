name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: npm test
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aiki_test
          POSTGRES_USER: aiki_test
          POSTGRES_PASSWORD: ci-disposable-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiki_test -d aiki_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for isolated browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Apply migrations twice and assert ledger stability
        env:
          DATABASE_URL: postgres://aiki_test:ci-disposable-password@127.0.0.1:5432/aiki_test
        run: |
          npm run db:migrate
          npm run db:migrate
          node --input-type=module -e "import pg from 'pg'; import { readdir, readFile } from 'node:fs/promises'; import { createHash } from 'node:crypto'; const db = new pg.Client({ connectionString: process.env.DATABASE_URL }); await db.connect(); const files = (await readdir('database/migrations')).filter(name => /^\\d{3}_[a-z0-9_]+\\.sql$/.test(name)).sort(); const expected = new Map(await Promise.all(files.map(async name => [name.slice(0, 3), createHash('sha256').update(await readFile('database/migrations/' + name)).digest('hex')]))); const rows = await db.query('SELECT version, checksum FROM schema_migrations ORDER BY version'); if (rows.rowCount !== expected.size || rows.rows.some(row => expected.get(row.version) !== row.checksum)) throw new Error('migration ledger mismatch'); await db.end(); console.log('PASS migration ledger matches all source checksums');"
      - name: Run isolated API smoke test
        env:
          DATABASE_URL: postgres://aiki_test:ci-disposable-password@127.0.0.1:5432/aiki_test
          RATE_LIMIT_SECRET: ci-rate-limit-secret-not-for-production
          READ_HMAC_SECRET: ci-read-hmac-secret-not-for-production
          NODE_ENV: production
          HOST: 127.0.0.1
          PORT: 3001
        run: |
          npm run build
          node .output/server/index.mjs > /tmp/aiki-ci-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3001/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/api/health
          node --input-type=module -e "import pg from 'pg'; const db = new pg.Client({ connectionString: process.env.DATABASE_URL }); await db.connect(); await db.query('TRUNCATE auth_rate_limits'); await db.end();"
          AIKI_TEST_BASE_URL=http://127.0.0.1:3001 npm run test:integration
          node --input-type=module -e "import pg from 'pg'; const db = new pg.Client({ connectionString: process.env.DATABASE_URL }); await db.connect(); await db.query('TRUNCATE auth_rate_limits'); await db.end();"
          AIKI_TEST_BASE_URL=http://127.0.0.1:3001 npm run test:integration:review
          node --input-type=module -e "import pg from 'pg'; const db = new pg.Client({ connectionString: process.env.DATABASE_URL }); await db.connect(); await db.query('TRUNCATE auth_rate_limits'); await db.end();"
          AIKI_TEST_BASE_URL=http://127.0.0.1:3001 npm run test:integration:revision-integrity
          npm run test:integration:citation-integrity
          node --input-type=module -e "import pg from 'pg'; const db = new pg.Client({ connectionString: process.env.DATABASE_URL }); await db.connect(); await db.query('TRUNCATE auth_rate_limits'); await db.end();"
          AIKI_TEST_BASE_URL=http://127.0.0.1:3001 npm run test:integration:agent-mcp

          node --input-type=module -e "import pg from 'pg'; const db = new pg.Client({ connectionString: process.env.DATABASE_URL }); await db.connect(); await db.query('TRUNCATE auth_rate_limits'); await db.end();"
          AIKI_E2E_BASE_URL=http://127.0.0.1:3001 npm run test:e2e
